[project]
name = "game3d-pipeline"
version = "0.1.0"
description = "Pipeline data peta Desa Tumanggal"
requires-python = ">=3.12"
dependencies = [
    "shapely>=2.0",
    "pyproj>=3.6",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
