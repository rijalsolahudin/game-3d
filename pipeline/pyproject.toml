[project]
name = "game3d-pipeline"
version = "0.1.0"
description = "Pipeline data peta Desa Tumanggal"
requires-python = ">=3.12"
dependencies = [
    "shapely>=2.0",
    "pyproj>=3.6",
    "httpx>=0.27",
    "rasterio>=1.5.2",
    "numpy>=2.5.5",
    "jsonschema>=4.26.0",
]

[dependency-groups]
dev = ["pytest>=8"]
# opsional: pembanding footprint untuk audit (scripts/fetch_open_buildings.py)
buildings-ref = ["duckdb>=2.0,<3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
